[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "droidseal"
# 版本号需与 package.json 保持一致
version = "1.1.0"
description = "Android release security with an evidence trail: audit, optional hardening, align, sign, verify (Windows x64 / Linux x64)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.9"
keywords = [
    "android",
    "apk",
    "apk-security",
    "apk-signing",
    "apksigner",
    "zipalign",
    "release-engineering",
    "android-security",
    "apk-hardening",
    "static-analysis",
    "taint-analysis",
    "sast",
    "sbom",
    "supply-chain",
    "devsecops",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
]
urls = { Homepage = "https://github.com/newnju/droidseal#readme", Source = "https://github.com/newnju/droidseal", Issues = "https://github.com/newnju/droidseal/issues", Changelog = "https://github.com/newnju/droidseal/blob/main/CHANGELOG.md", Security = "https://github.com/newnju/droidseal/security/policy", Releases = "https://github.com/newnju/droidseal/releases" }

[project.scripts]
droidseal = "droidseal:main"

[tool.setuptools]
packages = ["droidseal"]

[tool.setuptools.package-data]
droidseal = [
    "_bin/*",
    "_bin/@opentui/*",
    "_bin/@opentui/*/*",
    "_bin/third-party/*",
    "_bin/third-party/licenses/*",
    "_bin/third-party/licenses/*/*",
]
