name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # 发布预检门禁：type-check + test + release-check 一键执行，与本地 preflight 完全一致
      - run: bun scripts/preflight.ts

  package-windows-x64:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run release:check

  package-linux-x64:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Build (capture errors)
        shell: bash
        run: |
          set +e
          bun run build > /tmp/build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            tail -30 /tmp/build.log | while IFS= read -r line; do echo "::error::$line"; done
            exit $code
          fi
      - run: bun run release:check